[project]
name = "mems"
version = "0.1.0"
description = "Mems 分层记忆系统 - 四层记忆架构"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.21",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "qdrant-client>=1.12.0",
    "redis>=5.2.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "sentence-transformers>=3.3.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "apscheduler>=3.11.0",
    "openai>=1.0.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "datasets>=2.21.0",
    "ragas>=0.2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
# Keep the focused rule set without reformatting legacy prose and test fixtures.
ignore = ["E501"]
[tool.ruff.lint.extend-per-file-ignores]
"src/**/*.py" = ["I001"]
"scripts/init_db.py" = ["I001"]
"scripts/reset_dev_state.py" = ["I001"]
"tests/conftest.py" = ["I001"]
"tests/test_domain.py" = ["I001"]
"tests/test_mappers.py" = ["I001"]
"tests/test_redistill.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
plugins = ["pydantic.mypy"]
